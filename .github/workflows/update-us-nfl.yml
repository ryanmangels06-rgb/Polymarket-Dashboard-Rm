name: Update US NFL read-only snapshot

on:
  schedule:
    # Every 15 minutes with non-hour-boundary offset; schedules may be delayed.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-nfl-market-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install read-only market data dependencies
        run: python -m pip install "polymarket-us>=2.3,<3"
      - name: Fetch US market snapshot
        run: python scripts/update_us_snapshot.py
      - name: Commit latest US market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_us_nfl.json
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore(data): update public Polymarket US NFL quotes"
            git push
          fi
