name: Check US NFL feed code

on:
  push:
    paths:
      - "us_feed.py"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/check-us-feed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q us_feed.py scripts tests
